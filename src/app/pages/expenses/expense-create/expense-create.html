<div class="form-page">
  <div class="form-header">
    <button class="icon-btn" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 class="form-title">Record Expense</h1>
    <div style="width: 36px;"></div> <!-- spacer -->
  </div>

  @if (loading() || categoriesLoading()) {
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>
  } @else {
    <form class="form-body" (ngSubmit)="onSubmit()" #expenseForm="ngForm">
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input 
            type="date" 
            class="form-input" 
            [(ngModel)]="createdAtInput" 
            name="createdAt" 
            required>
        </div>

        <div class="form-group">
          <label class="form-label">Category *</label>
          <select 
            class="form-input" 
            [(ngModel)]="expense.categoryId" 
            name="categoryId" 
            required>
            @for (category of categories(); track category.id) {
              <option [value]="category.id">{{ category.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Amount *</label>
          <input 
            type="number" 
            class="form-input" 
            [(ngModel)]="expense.amount" 
            name="amount" 
            placeholder="0.00"
            required>
        </div>

        <div class="form-group">
          <label class="form-label">Payment Mode *</label>
          <select 
            class="form-input" 
            [(ngModel)]="expense.paymentMode" 
            name="paymentMode" 
            required>
            @for (mode of paymentModes; track mode) {
              <option [value]="mode">{{ mode }}</option>
            }
          </select>
        </div>
      </div>

      @if (isLaborCategorySelected()) {
        <div class="form-group" style="background: var(--surface-hover); padding: 1rem; border-radius: 0.5rem; border: 1.5px dashed var(--surface-border); margin-bottom: 1.25rem;">
          @if (showAddLaborForm()) {
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
              <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">Create New Helping Partner</span>
              <button type="button" (click)="toggleAddLaborForm()" style="background: none; border: none; color: var(--accent); font-size: 0.8rem; font-weight: 700; cursor: pointer;">Cancel</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" style="font-size: 0.75rem;">Helping Partner Name *</label>
                <input type="text" class="form-input" [(ngModel)]="newLaborName" name="newLaborName" placeholder="E.g., Arjun K" style="padding: 0.4rem; font-size: 0.85rem;" />
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" style="font-size: 0.75rem;">Phone Number (Optional)</label>
                <input type="text" class="form-input" [(ngModel)]="newLaborPhone" name="newLaborPhone" placeholder="E.g., 9876543210" style="padding: 0.4rem; font-size: 0.85rem;" />
              </div>
              <button type="button" class="submit-btn" (click)="saveNewLabor()" [disabled]="!newLaborName.trim() || laborSaving()" style="padding: 0.45rem; font-size: 0.8rem; align-self: flex-start; margin-top: 0.25rem;">
                @if (laborSaving()) { Saving... } @else { Save Helping Partner }
              </button>
            </div>
          } @else {
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.35rem;">
              <label class="form-label" style="margin-bottom: 0; font-weight: 600;">Helping Partner *</label>
              <button type="button" (click)="toggleAddLaborForm()" style="background: none; border: none; color: var(--accent); font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.2rem; padding: 0;">
                <span>+ Create New Helping Partner</span>
              </button>
            </div>
            <select class="form-input" [ngModel]="selectedPartnerKey()" (ngModelChange)="onPartnerChange($event)" name="partnerKey" style="padding: 0.5rem; font-size: 0.85rem;" required>
              <option [value]="undefined" disabled selected>Select Helping Partner...</option>
              <optgroup label="Helping Partners">
                @for (labor of allLabors(); track 'labor_' + labor.id) {
                  <option [value]="'labor_' + labor.id">{{ labor.name }} @if (labor.phone) { ({{ labor.phone }}) }</option>
                }
              </optgroup>
              <optgroup label="Sales Partners">
                @for (sp of allSalesPersons(); track 'sp_' + sp.id) {
                  <option [value]="'sp_' + sp.id">{{ sp.name }}</option>
                }
              </optgroup>
            </select>
          }
        </div>
      } @else {
        <div class="form-group">
          <label class="form-label">Vendor Name</label>
          <input 
            type="text" 
            class="form-input" 
            [(ngModel)]="expense.vendorName" 
            name="vendorName" 
            placeholder="E.g., ABC Supplies">
        </div>
      }

      <div class="form-group">
        <label class="form-label">Reference / Bill No</label>
        <input 
          type="text" 
          class="form-input" 
          [(ngModel)]="expense.referenceNumber" 
          name="referenceNumber" 
          placeholder="Txn ID, Bill No, etc.">
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea 
          class="form-input" 
          [(ngModel)]="expense.description" 
          name="description" 
          rows="3"
          placeholder="What was this expense for?"></textarea>
      </div>

      <div class="btn-row">
        <button type="button" class="cancel-btn" (click)="goBack()" [disabled]="loading()">Cancel</button>
        <button type="submit" class="submit-btn" [disabled]="!expenseForm.form.valid || loading() || !expense.categoryId">
          @if (loading()) {
            <span class="btn-spinner"></span>
            Saving...
          } @else {
            Save
          }
        </button>
      </div>
    </form>
  }
</div>
